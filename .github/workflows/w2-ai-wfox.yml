name: W2 AI-WFox

on:
  pull_request:
    paths:
      - "members/ai_wfox/w2/**"
      - "members/philip_kkk/w1/**"
      - "tests/test_w2.py"
      - "tests/conftest.py"
      - "samples/**"
      - ".github/workflows/w2-ai-wfox.yml"
  push:
    branches: [main]
    paths:
      - "members/ai_wfox/w2/**"
      - "members/philip_kkk/w1/**"
      - "tests/test_w2.py"
      - "tests/conftest.py"
      - "samples/**"
      - ".github/workflows/w2-ai-wfox.yml"

jobs:
  w2-ai-wfox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest ruff
      - run: python -m ruff check members/ai_wfox/w2
      - run: python -m ruff format --check members/ai_wfox/w2
      - run: python -m pytest -q tests/test_w2.py members/ai_wfox/w2/test_exercises.py members/ai_wfox/w2/tests_for_philip_kkk.py --member ai_wfox
